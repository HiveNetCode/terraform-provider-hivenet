# Acceptance tests against staging, then a sweep of leaked tf-acc-* resources
# and a spend summary.
#
# The staging API key comes from Vault via GitHub OIDC. The Vault role only
# accepts this file on main, so it cannot run on pull requests. VAULT_ADDR and
# VAULT_SECRET_PATH are secrets only so that run logs mask them.
name: Acceptance

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      gpu:
        description: Also run tests that need a GPU preset
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Runs share one staging org and its credit balance; never overlap them.
concurrency:
  group: acceptance
  cancel-in-progress: false

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  VAULT_SECRETS: |
    ${{ secrets.VAULT_SECRET_PATH }} token | HIVENET_TOKEN ;
    ${{ secrets.VAULT_SECRET_PATH }} endpoint | HIVENET_ENDPOINT ;
    ${{ secrets.VAULT_SECRET_PATH }} cpu_preset | HIVENET_ACC_CPU_PRESET ;
    ${{ secrets.VAULT_SECRET_PATH }} gpu_preset | HIVENET_ACC_GPU_PRESET

jobs:
  test:
    name: 'Acceptance Tests: ${{ matrix.cli }} ${{ matrix.version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Jobs share one fixture instance; in parallel one stops it while another waits for RUNNING.
      max-parallel: 1
      matrix:
        include:
          - cli: terraform
            version: '1.13.*'
          - cli: terraform
            version: '1.14.*'
          - cli: tofu
            version: 'latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - if: matrix.cli == 'tofu'
        run: |
          echo "TF_ACC_TERRAFORM_PATH=$(which tofu)" >> "$GITHUB_ENV"
          # OpenTofu rejects reattached providers under registry.terraform.io.
          echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org" >> "$GITHUB_ENV"
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: github-actions
          role: terraform-provider-hivenet-acc
          jwtGithubAudience: ${{ env.VAULT_ADDR }}
          secrets: ${{ env.VAULT_SECRETS }}
      - run: go mod download
      - env:
          TF_ACC: '1'
          HIVENET_ACC_GPU: ${{ inputs.gpu && '1' || '' }}
          # Not secret; a repository variable so the test skips until it is set.
          HIVENET_ACC_INSTANCE_ID: ${{ vars.HIVENET_ACC_INSTANCE_ID }}
        run: go test -v -cover -timeout 50m ./internal/provider/

  sweep:
    name: Sweep leaked resources
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: github-actions
          role: terraform-provider-hivenet-acc
          jwtGithubAudience: ${{ env.VAULT_ADDR }}
          secrets: ${{ env.VAULT_SECRETS }}
      - run: go test -v -timeout 25m ./internal/provider/ -sweep=staging
      - name: Spend summary
        if: always()
        run: go run ./internal/cmd/acccost >> "$GITHUB_STEP_SUMMARY"
